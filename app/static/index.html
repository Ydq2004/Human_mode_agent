<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human-mode Agent</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #15171b; color: #eceff4; min-height: 100vh; }
    .app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
    aside { display: none; }
    h1 { font-size: 18px; margin: 0 0 24px; }
    h2 { font-size: 13px; color: #9ca5b3; text-transform: uppercase; letter-spacing: .08em; margin: 22px 0 8px; }
    .slot { width: 100%; text-align: left; border: 1px solid #303640; background: transparent; color: inherit; padding: 10px; margin: 4px 0; border-radius: 6px; cursor: pointer; }
    .slot.active { border-color: #79a8ff; background: #222c3c; }
    .slot small { display: block; color: #9ca5b3; margin-top: 4px; overflow-wrap: anywhere; }
    button { border: 1px solid #3c4654; border-radius: 6px; background: #242a33; color: inherit; padding: 8px 12px; cursor: pointer; }
    button:hover { background: #303947; }
    button.danger { border-color: #8f4f58; background: #3a252a; }
    button.danger:hover { background: #512d34; }
    .fixed-actions { position: fixed; top: 14px; right: 22px; z-index: 10; display: flex; gap: 8px; }
    main { display: flex; flex-direction: column; min-width: 0; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #2d323a; }
    #status { color: #9ca5b3; font-size: 13px; }
    #progress-bar { display: none; position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); z-index: 20; width: min(760px, calc(100% - 40px)); padding: 10px 14px; border: 1px solid #3d5f91; border-radius: 8px; background: #1d2a3d; color: #a9c9ff; font-size: 14px; box-shadow: 0 4px 18px #0008; }
    #progress-bar.active { display: block; }
    #progress-bar::before { content: '●'; display: inline-block; margin-right: 8px; color: #79a8ff; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    #messages { flex: 1; overflow: auto; padding: 24px max(20px, calc((100vw - 900px) / 2)); }
    .message { max-width: 760px; margin: 0 auto 18px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
    .message.user { color: #b9d2ff; }
    .message.agent { color: #f2f4f8; }
    .label { font-size: 12px; color: #7f8997; margin-bottom: 3px; }
    .media { max-width: 100%; max-height: 520px; border-radius: 6px; margin-top: 9px; border: 1px solid #3c4654; }
    form { display: flex; gap: 8px; padding: 16px max(20px, calc((100vw - 900px) / 2)); border-top: 1px solid #2d323a; }
    textarea { flex: 1; min-height: 48px; max-height: 180px; resize: vertical; border: 1px solid #3c4654; border-radius: 6px; background: #20242b; color: inherit; padding: 12px; font: inherit; }
    input[type=file] { display: none; }
    .tools { display: flex; gap: 8px; align-items: center; }
    dialog { color: inherit; background: #1e2228; border: 1px solid #3c4654; border-radius: 8px; width: min(520px, 92vw); }
    dialog::backdrop { background: #0009; }
    .settings-row { display: flex; gap: 8px; margin: 12px 0; }
    .settings-row input { flex: 1; min-width: 0; border: 1px solid #3c4654; border-radius: 6px; background: #20242b; color: inherit; padding: 9px; }
    .muted { color: #9ca5b3; font-size: 13px; }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Human-mode Agent</h1>
      <h2>角色槽位</h2>
      <div id="slots" class="muted">加载中...</div>
    </aside>
    <main>
      <header><strong id="persona">加载中...</strong><span id="status"></span></header>
      <div id="progress-bar" role="status" aria-live="polite"><span id="progress"></span></div>
      <section id="messages" aria-live="polite"></section>
      <form id="composer">
        <div class="tools"><button id="imageButton" type="button">选择图片</button><input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><button type="submit">发送</button></div>
        <textarea id="content" placeholder="输入消息..." aria-label="消息"></textarea>
      </form>
    </main>
  </div>
  <div class="fixed-actions"><button id="reload" type="button">刷新配置</button><button id="settings" type="button">设置</button></div>
  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <h2>运行设置</h2>
      <div class="settings-row"><input id="thread" placeholder="长期对话 thread_id"><button id="saveThread" type="button">切换线程</button></div>
      <h2>角色卡</h2>
      <div class="settings-row"><input id="slotPath" placeholder="尚未选择角色文件夹" readonly><button id="chooseSlotFolder" type="button">切换角色卡</button></div>
      <p class="muted">点击“切换角色卡”后，在弹出的窗口选择包含 persona_config.json 的文件夹；保存后请手动重启后端。</p>
      <div class="settings-row"><button id="shutdown" class="danger" type="button">退出应用</button></div>
      <button type="submit">关闭</button>
    </form>
  </dialog>
  <script>
    const $ = (id) => document.getElementById(id);
    const messages = $('messages');
    const localMessages = new Map();
    const pendingEventKey = 'human_mode_pending_events';
    const legacyPendingEventKey = 'human_mode_pending_event';
    let localMessageOrder = 0;
    let serverMessages = [];
    let historyRequestSequence = 0;
    let appliedHistoryRequest = 0;
    function esc(text) { return String(text ?? ''); }
    function mediaUrl(kind, filename) { return `/media/${kind}/${encodeURIComponent(filename)}`; }
    function messageKey(m) {
      return `${m.event_id || ''}:${m.kind || ''}:${m.action_id || ''}`;
    }
    function rememberLocalMessage(m) {
      const message = {...m, _localOrder: ++localMessageOrder};
      localMessages.set(messageKey(message), message);
      return message;
    }
    function readPendingEvents() {
      let value;
      try {
        const raw = localStorage.getItem(pendingEventKey) ?? localStorage.getItem(legacyPendingEventKey) ?? '[]';
        value = JSON.parse(raw);
      } catch (_) { value = []; }
      if (Array.isArray(value)) return value.filter(item => item && item.event_id);
      // 兼容上一版只保存一个对象的格式，避免正在处理的消息在升级后消失。
      return value && value.event_id ? [value] : [];
    }
    function writePendingEvents(items) {
      if (items.length) localStorage.setItem(pendingEventKey, JSON.stringify(items));
      else localStorage.removeItem(pendingEventKey);
      localStorage.removeItem(legacyPendingEventKey);
    }
    function upsertPendingEvent(eventId, patch) {
      const items = readPendingEvents();
      const index = items.findIndex(item => item.event_id === eventId);
      const next = {...(index >= 0 ? items[index] : {event_id: eventId}), ...patch};
      if (index >= 0) items[index] = next; else items.push(next);
      writePendingEvents(items);
      return next;
    }
    function removePendingEvent(eventId) {
      writePendingEvents(readPendingEvents().filter(item => item.event_id !== eventId));
    }
    function showLocalMessage(message) {
      rememberLocalMessage(message);
      renderMessageList(serverMessages);
    }
    function renderMessage(m) {
      const el = document.createElement('article');
      el.className = `message ${m.kind}`;
      el.dataset.messageKey = messageKey(m);
      const label = document.createElement('div'); label.className = 'label'; label.textContent = m.kind === 'user' ? '我' : 'Agent';
      const body = document.createElement('div'); body.textContent = esc(m.content);
      el.append(label, body);
      (m.media || []).forEach(item => {
        const img = document.createElement('img');
        img.className = 'media';
        img.src = mediaUrl('generated', item.filename);
        img.alt = 'Agent 生成的图片';
        el.appendChild(img);
      });
      if (m.metadata?.path && m.modality === 'image') {
        const img = document.createElement('img');
        img.className = 'media';
        img.src = mediaUrl('attachments', m.metadata.path.split(/[\\/]/).pop());
        img.alt = '用户提交的图片';
        el.appendChild(img);
      }
      messages.appendChild(el);
    }
    function renderMessageList(historyMessages) {
      const history = Array.isArray(historyMessages) ? historyMessages : [];
      // 所有重绘都经过这里。这样历史请求返回旧快照时，也会保留尚未被
      // 服务端确认的本地消息，不会把用户刚发出的内容从画面上抹掉。
      const serverKeys = new Set(history.map(messageKey));
      for (const [key] of localMessages) {
        if (serverKeys.has(key)) localMessages.delete(key);
      }
      const merged = [...history, ...localMessages.values()];
      merged.sort((left, right) => {
        const leftSequence = Number.isFinite(Number(left.event_sequence)) ? Number(left.event_sequence) : Number.MAX_SAFE_INTEGER;
        const rightSequence = Number.isFinite(Number(right.event_sequence)) ? Number(right.event_sequence) : Number.MAX_SAFE_INTEGER;
        if (leftSequence !== rightSequence) return leftSequence - rightSequence;
        const leftTime = String(left.occurred_at || '');
        const rightTime = String(right.occurred_at || '');
        if (leftTime !== rightTime) return leftTime.localeCompare(rightTime);
        return (left._localOrder || 0) - (right._localOrder || 0);
      });
      messages.replaceChildren();
      merged.forEach(renderMessage);
      messages.scrollTop = messages.scrollHeight;
      const last = messages.lastElementChild;
      if (last) last.scrollIntoView({block: 'end'});
    }
    async function fetchHistory() {
      const requestId = ++historyRequestSequence;
      const response = await fetch('/api/history');
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || data.error || '历史记录读取失败');
      // 较早发出的请求可能较晚返回，不能让它覆盖更新的历史快照。
      if (requestId < appliedHistoryRequest) return serverMessages;
      appliedHistoryRequest = requestId;
      const incoming = Array.isArray(data.messages) ? data.messages : [];
      // ExperienceSlice 是追加且不可变的；把本次快照与已确认历史合并，
      // 防止数据库提交窗口或临时短响应让旧记录从界面上消失。
      const known = new Map(serverMessages.map(item => [messageKey(item), item]));
      incoming.forEach(item => known.set(messageKey(item), item));
      serverMessages = [...known.values()];
      renderMessageList(serverMessages);
      reconcilePendingEvents(serverMessages);
      return serverMessages;
    }
    function reconcilePendingEvents(history) {
      const keys = new Set((history || []).map(messageKey));
      const remaining = readPendingEvents().filter(item => {
        // 只有服务端已经有 Agent 回复，才认为整轮消息可靠落库。
        // 仅有 user 记录时继续保留本地缓存，防止刷新期间丢失未完成轮次。
        return !(keys.has(`${item.event_id}:user:`) && keys.has(`${item.event_id}:agent:`));
      });
      writePendingEvents(remaining);
    }
    async function loadHistory() {
      return fetchHistory();
    }
    async function syncHistory(eventId) {
      // 事件状态先于历史查询返回时，给 SQLite 写入一个很短的提交窗口，
      // 避免完成后的首个刷新仍读到旧列表。
      for (let attempt = 0; attempt < 4; attempt += 1) {
        const history = await fetchHistory();
        if (!eventId || history.some(item => item.event_id === eventId && item.kind === 'agent')) return true;
        await new Promise(resolve => setTimeout(resolve, 150));
      }
      return false;
    }
    async function waitForEvent(eventId) {
      let state = {};
      for (let attempt = 0; attempt < 1500; attempt += 1) {
        await new Promise(resolve => setTimeout(resolve, 400));
        const response = await fetch(`/api/event/${encodeURIComponent(eventId)}`);
        state = await response.json();
        if (!response.ok) {
          const error = new Error(state.message || state.error || '无法读取本轮处理状态');
          error.eventNotFound = response.status === 404;
          throw error;
        }
        const labels = {queued:'排队中…', perception:'正在感知事件…', understanding:'正在理解输入…', memory_activation:'正在唤起相关记忆…', agent:'Agent 正在生成回复…', tool:'正在调用工具…', experience:'正在保存本轮经历…', completed:'处理完成', failed:'处理失败'};
        $('progress').textContent = labels[state.stage] || '正在处理…';
        // 兼容旧版后端把成功结果标成 succeeded 的响应；新版使用
        // completed 表示异步事件已结束。
        if (state.status === 'completed' || state.status === 'succeeded' || state.status === 'failed') return state;
      }
      throw new Error('本轮处理超过 10 分钟，已停止等待；可稍后刷新查看历史。');
    }
    async function loadStatus() {
      const data = await (await fetch('/api/status')).json();
      $('persona').textContent = data.persona || 'Agent';
      $('status').textContent = `${data.thread_id} · ${data.status}`;
      $('thread').value = data.thread_id || '';
    }
    async function loadSlots() {
      const data = await (await fetch('/api/slots')).json();
      const root = $('slots'); root.replaceChildren();
      (data.slots || []).forEach(slot => {
        const button = document.createElement('button'); button.className = `slot ${slot.slot_id === data.active_slot_id ? 'active' : ''}`;
        const title = document.createElement('span'); title.textContent = esc(slot.name);
        const id = document.createElement('small'); id.textContent = esc(slot.slot_id);
        button.append(title, id);
        button.onclick = async () => {
          if (slot.slot_id === data.active_slot_id) return;
          const response = await fetch('/api/slots/active', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({slot_id: slot.slot_id}) });
          const result = await response.json();
          alert(result.message || result.error || '操作完成');
        };
        root.appendChild(button);
      });
    }
    $('composer').onsubmit = async (event) => {
      event.preventDefault();
      const text = $('content').value.trim();
      const file = $('image').files[0];
      if (!text && !file) return;
      $('content').value = '';
      $('progress').textContent = '消息已发送，正在感知事件…'; $('progress-bar').classList.add('active');
      document.querySelector('button[type="submit"]').disabled = true;
      $('content').disabled = true; $('imageButton').disabled = true; $('image').disabled = true;
      let userEventId = '';
      const resetComposer = () => {
        $('progress').textContent = ''; $('progress-bar').classList.remove('active');
        document.querySelector('button[type="submit"]').disabled = false;
        $('content').disabled = false; $('imageButton').disabled = false; $('image').disabled = false;
      };
      try {
        let response;
        if (file) {
          const form = new FormData(); form.append('file', file);
          response = await fetch('/api/image', {method:'POST', body:form});
        } else {
          response = await fetch('/api/message', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content:text})});
        }
        const result = await response.json();
        userEventId = result.event_id || '';
        if (!response.ok || !userEventId) throw new Error(result.message || result.error || '消息未能进入处理队列');
        const localOccurredAt = new Date().toISOString();
        upsertPendingEvent(userEventId, {
          content: text || '[图片]',
          metadata: file ? {path: result.input_media?.filename || ''} : {},
          occurred_at: localOccurredAt,
          status: 'pending',
        });
        // 先显示用户消息，即使后台稍后失败或页面失去连接，输入也不会凭空消失。
        showLocalMessage({event_id: userEventId, kind: 'user', occurred_at: localOccurredAt, content: text || '[图片]', metadata: file ? {path: result.input_media?.filename || ''} : {}});

        // 最长等待 10 分钟；网络错误和超时都必须结束等待，不能永久卡在处理中。
        const state = await waitForEvent(userEventId);
        if (state.status === 'failed') {
          throw new Error(state.error || '本轮处理失败');
        }

        const immediateMessage = rememberLocalMessage({event_id: userEventId, kind: 'agent', occurred_at: new Date().toISOString(), content: state.visible_reply || '', media: state.media || []});
        upsertPendingEvent(userEventId, {status: 'completed', agent: immediateMessage});
        if (immediateMessage.content || immediateMessage.media.length) renderMessageList(serverMessages);
        const persisted = await syncHistory(userEventId);
        if (persisted) removePendingEvent(userEventId);
        await loadStatus();
      } catch (error) {
        $('progress').textContent = `本轮未完成：${error.message || error}`;
        if (userEventId) {
          const failure = {event_id: userEventId, kind: 'agent', occurred_at: new Date().toISOString(), content: `（处理未完成：${error.message || error}）`};
          upsertPendingEvent(userEventId, {status: 'failed', agent: failure});
          showLocalMessage(failure);
        }
      } finally {
        $('image').value = '';
        resetComposer();
      }
    };
    $('imageButton').onclick = () => $('image').click();
    $('image').onchange = () => {
      const file = $('image').files[0];
      if (file) $('content').placeholder = `已选择：${file.name}，点击发送`;
    };
    $('settings').onclick = () => $('settingsDialog').showModal();
    $('saveThread').onclick = async () => {
      const response = await fetch('/api/settings/thread', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({thread_id:$('thread').value})});
      const result = await response.json(); alert(result.message || result.error || '线程已切换'); if (response.ok) { serverMessages = []; await loadHistory(); await loadStatus(); }
    };
    $('reload').onclick = async () => { const response = await fetch('/api/settings/reload', {method:'POST'}); const result = await response.json(); alert(result.error || '配置已刷新'); if (response.ok) { serverMessages = []; await loadHistory(); await loadStatus(); } };
    $('chooseSlotFolder').onclick = async () => {
      const picker = await (await fetch('/api/choose_slot_folder', {method:'POST'})).json();
      if (picker.status !== 'selected') return;
      const path = picker.path;
      const response = await fetch('/api/slots/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path})});
      const result = await response.json();
      if (!response.ok) { alert(result.message || result.error || '角色卡切换失败'); return; }
      $('slotPath').value = path;
      alert('角色卡已保存，请手动重启后端后生效');
    };
    $('shutdown').onclick = async () => {
      if (!confirm('退出应用并关闭本机后台？当前正在处理的后台任务会先完成收尾。')) return;
      $('shutdown').disabled = true;
      $('shutdown').textContent = '正在关闭...';
      try {
        const response = await fetch('/api/shutdown', {method:'POST'});
        const result = await response.json();
        const main = document.createElement('main'); main.style.padding = '32px';
        const heading = document.createElement('h1'); heading.textContent = '应用已请求关闭';
        const message = document.createElement('p'); message.textContent = `${result.message || '本机后台正在停止。'} 可以关闭此页面。`;
        main.append(heading, message); document.body.replaceChildren(main);
      } catch (error) {
        const main = document.createElement('main'); main.style.padding = '32px';
        const heading = document.createElement('h1'); heading.textContent = '应用正在关闭';
        const message = document.createElement('p'); message.textContent = '本机后台已停止响应，可以关闭此页面。';
        main.append(heading, message); document.body.replaceChildren(main);
      }
    };
    async function resumePendingEvent() {
      const pendingEvents = readPendingEvents();
      if (!pendingEvents.length) return;
      pendingEvents.forEach(pending => {
        showLocalMessage({event_id: pending.event_id, kind: 'user', occurred_at: pending.occurred_at || new Date().toISOString(), content: pending.content || '[消息]', metadata: pending.metadata || {}});
        if (pending.agent) showLocalMessage(pending.agent);
      });
      const pending = pendingEvents.find(item => item.status === 'pending');
      if (!pending) return;
      $('progress').textContent = '页面已恢复，正在继续处理…'; $('progress-bar').classList.add('active');
      document.querySelector('button[type="submit"]').disabled = true;
      $('content').disabled = true; $('imageButton').disabled = true; $('image').disabled = true;
      try {
        const state = await waitForEvent(pending.event_id);
        if (state.status === 'failed') {
          throw new Error(state.error || '本轮处理失败');
        }
        const immediateMessage = rememberLocalMessage({event_id: pending.event_id, kind: 'agent', occurred_at: new Date().toISOString(), content: state.visible_reply || '', media: state.media || []});
        upsertPendingEvent(pending.event_id, {status: 'completed', agent: immediateMessage});
        if (immediateMessage.content || immediateMessage.media.length) renderMessageList(serverMessages);
        const persisted = await syncHistory(pending.event_id);
        if (persisted) removePendingEvent(pending.event_id);
        await loadStatus();
      } catch (error) {
        $('progress').textContent = `本轮未完成：${error.message || error}`;
        const failure = {event_id: pending.event_id, kind: 'agent', occurred_at: new Date().toISOString(), content: `（处理未完成：${error.message || error}）`};
        upsertPendingEvent(pending.event_id, {status: 'failed', agent: failure});
        showLocalMessage(failure);
      } finally {
        $('progress-bar').classList.remove('active');
        document.querySelector('button[type="submit"]').disabled = false;
        $('content').disabled = false; $('imageButton').disabled = false; $('image').disabled = false;
      }
    }
    Promise.all([loadHistory(), loadStatus(), loadSlots()]).then(resumePendingEvent).catch(err => alert(err));
  </script>
</body>
</html>
